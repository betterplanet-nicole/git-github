AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TTME (TalkToMyEnergy) serverless prototype stack

Globals:
  Function:
    Runtime: python3.11
    Timeout: 20
    MemorySize: 512
    Environment:
      Variables:
        APP_TABLE: !Ref AppDataTable
        ALERTS_TABLE: !Ref AlertsTable
        ENERGY_DB_NAME: !Ref EnergyTimestreamDatabase
        ENERGY_TABLE_NAME: !Ref EnergyTimestreamTable

Resources:
  TTMEApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: TTMEApi
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  AppDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TableName: ttme-app-data

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alert_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: alert_id
          KeyType: HASH
        - AttributeName: created_at
          KeyType: RANGE
      TableName: ttme-alerts

  EnergyTimestreamDatabase:
    Type: AWS::Timestream::Database
    Properties:
      DatabaseName: ttme-energy

  EnergyTimestreamTable:
    Type: AWS::Timestream::Table
    Properties:
      DatabaseName: !Ref EnergyTimestreamDatabase
      TableName: smart-meter-events
      RetentionProperties:
        MemoryStoreRetentionPeriodInHours: "24"
        MagneticStoreRetentionPeriodInDays: "365"

  EnergyEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: handlers.energy_events.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref AppDataTable
        - Statement:
            - Effect: Allow
              Action:
                - timestream:WriteRecords
                - timestream:DescribeEndpoints
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TTMEApi
            Path: /energy/events
            Method: POST

  AnomalyDetectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: handlers.anomaly_detect.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref AlertsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TTMEApi
            Path: /anomaly/detect
            Method: POST

  CustomerInsightsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: handlers.customer_insights.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy:
            TableName: !Ref AppDataTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TTMEApi
            Path: /customer/insights
            Method: GET

  OutageStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: handlers.outage_status.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy:
            TableName: !Ref AlertsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TTMEApi
            Path: /outage/status
            Method: GET

  ChatQueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: handlers.chat_query.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TTMEApi
            Path: /chat/query
            Method: POST

  AdminAlertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: handlers.admin_alerts.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy:
            TableName: !Ref AlertsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TTMEApi
            Path: /admin/alerts
            Method: GET

  MeterStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: ttme-meter-scada-stream
      StreamModeDetails:
        StreamMode: ON_DEMAND

Outputs:
  ApiUrl:
    Description: API endpoint URL
    Value: !Sub "https://${TTMEApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  MeterStreamName:
    Description: Kinesis stream for smart meter and SCADA events
    Value: !Ref MeterStream
